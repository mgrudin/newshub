<!doctype html>
<html lang="en">
  <head>
    <title>NewsHUB</title>
  </head>
  <body>
    <h1>NewsHUB</h1>
    {% for source in sources %}
    <h2>{{source.title}} - {{ source.url }}</h2>
    <ul id="articles">
      {% for article in articles %}
      <li>{{ article.title }}</li>
      {% endfor %}
    </ul>
    {% endfor %}
  </body>
</html>
